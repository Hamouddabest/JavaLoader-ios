name: Build IPA
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch submodules at Amethyst's pinned commits
        run: |
          set -e
          clone() { rm -rf "$1"; git clone -q "$2" "$1"; git -C "$1" checkout -q "$3"; git -C "$1" submodule update --init --recursive -q; }
          clone Natives/external/AFNetworking https://github.com/AFNetworking/AFNetworking d9f589cc2c1fe9d55eb5eea00558010afea7a41e
          clone Natives/external/DBNumberedSlider https://github.com/khanhduytran0/DBNumberedSlider 4eddc68b5f92247f8afc0f6114d1b92b338749f4
          clone Natives/external/MobileGlues https://github.com/MobileGL-Dev/MobileGlues f0fb4d32794a130f4021342605a751ef2d0f84d8
          clone Natives/external/fishhook https://github.com/khanhduytran0/fishhook ab23646149fd8594545668754a1b7ded56a1b9af
      - uses: actions/setup-java@v4
        with: { distribution: zulu, java-version: "8" }
      - name: Tools
        run: brew install cmake ldid make
      - name: Build
        run: |
          export PATH="$(brew --prefix make)/libexec/gnubin:$PATH"
          export SLIMMED=1 BOOTJDK="$JAVA_HOME/bin"
          make -j$(sysctl -n hw.ncpu) dsym package PLATFORM=2
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: artifacts/*.ipa
      - name: Release
        if: github.ref == 'refs/heads/main'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest artifacts/*.ipa -t "Latest build" -n "Automatic build"
