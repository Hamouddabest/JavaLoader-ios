name: Build IPA
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch submodules (kept as plain files in this repo)
        run: |
          set -e
          git config -f .gitmodules --get-regexp '\.url$' | while read key url; do
            name=${key%.url}; path=$(git config -f .gitmodules --get $name.path)
            branch=$(git config -f .gitmodules --get $name.branch || true)
            if [ -z "$(ls -A $path 2>/dev/null)" ]; then
              rm -rf "$path"
              git clone --depth 1 ${branch:+-b $branch} "$url" "$path" || git clone --depth 1 "$url" "$path"
            fi
          done
      - name: Tools
        run: brew install cmake ldid make
      - name: Build
        run: |
          export PATH="$(brew --prefix make)/libexec/gnubin:$PATH"
          export SLIMMED=1
          make -j$(sysctl -n hw.ncpu) dsym package PLATFORM=2
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: artifacts/*.ipa
      - name: Release
        if: github.ref == 'refs/heads/main'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest artifacts/*.ipa -t "Latest build" -n "Automatic build"
